<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{HOST_NAME}} {{NOUN}} guides | {{SHOP_NAME}}</title>
    <meta
      name="description"
      content="How to understand and install {{HOST_NAME}} {{NOUN_PLURAL}}."
    />
    <link rel="canonical" href="https://{{DOMAIN}}/guides/" />
        <script>
      (function () {
        try {
          var k = "aiaaii-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") {
            var m = document.cookie.match(/(?:^|; )aiaaii-theme=(light|dark)/);
            t = m ? m[1] : null;
          }
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="wrap-wide">
        <div class="site-header">
          <a class="brand" href="/">
            <span class="brand-name">{{SHOP_NAME}}</span>
            <span class="brand-domain">{{DOMAIN}}</span>
          </a>
                    <div class="header-end">
            <nav class="nav">
            <a href="/">Home</a>
            <a href="/items/">Plugins</a>
            <a href="/guides/">Guides</a>
            <a href="/submit/">Submit</a>
          </nav>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch color theme" title="Theme">
              <span class="theme-toggle-icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
      <header class="page-hero">
        <div class="wrap">
          <h1>{{HOST_NAME}} {{NOUN}} guides</h1>
          <p>Concept → install → operate → troubleshoot</p>
        </div>
      </header>
    </div>
    <main class="section">
      <div class="wrap guide-list">
        <a href="/guides/what-is-a-plugin/"
          >What is a {{PRIMARY_KEYWORD}}<span>Concepts, scopes, and trust</span></a
        >
        <a href="/guides/how-to-install/"
          >How to install a {{PRIMARY_KEYWORD}}<span>{{INSTALL_CMD}}</span></a
        >
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap-wide"><p><a href="/">← Market</a></p></div>
    </footer>
      <script src="/theme.js" defer></script>
  </body>
</html>
