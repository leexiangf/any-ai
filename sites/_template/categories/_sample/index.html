<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{CATEGORY_SLUG}} {{HOST_NAME}} {{NOUN_PLURAL}} | {{SHOP_NAME}}</title>
    <meta
      name="description"
      content="{{CATEGORY_SLUG}} {{HOST_NAME}} {{NOUN_PLURAL}} — community directory on {{DOMAIN}}."
    />
    <link rel="canonical" href="https://{{DOMAIN}}/categories/{{CATEGORY_SLUG}}/" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="wrap-wide">
        <div class="site-header">
          <a class="brand" href="/">
            <span class="brand-name">{{SHOP_NAME}}</span>
            <span class="brand-domain">{{DOMAIN}}</span>
          </a>
          <nav class="nav">
            <a href="/items/">Plugins</a>
            <a href="/guides/">Guides</a>
            <a href="/submit/">Submit</a>
          </nav>
        </div>
      </div>
      <header class="page-hero">
        <div class="wrap">
          <h1>{{CATEGORY_SLUG}}</h1>
          <p>Category pitch — what belongs here.</p>
        </div>
      </header>
    </div>
    <main class="section">
      <div class="wrap">
        <div class="item-list">
          <a class="item" href="/items/{{OWNER}}/{{SLUG}}/">
            <div class="item-body">
              <h2 class="item-name">{{SLUG}}</h2>
              <p class="item-one">One-line description.</p>
            </div>
            <span class="item-badge">{{CATEGORY_SLUG}}</span>
          </a>
        </div>
        <div class="prose" style="margin-top: 2.5rem">
          <h2>We look for</h2>
          <p>1. Clear scope · 2. Real install path · 3. Public auditable source</p>
          <p><a href="/items/">All {{NOUN_PLURAL}}</a> · <a href="/guides/">Guides</a></p>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap-wide"><p><a href="/">← Market</a></p></div>
    </footer>
  </body>
</html>
