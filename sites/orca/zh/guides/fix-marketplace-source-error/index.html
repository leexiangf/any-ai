    <link rel="alternate" hreflang="zh-CN" href="https://orca.aiaaii.com/zh/guides/fix-marketplace-source-error/" />
    <script>
      (function () {
        try {
          var k = "aiaaii-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") {
            var m = document.cookie.match(/(?:^|; )aiaaii-theme=(light|dark)/);
            t = m ? m[1] : null;
          }
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>

    <div class="page-shell">

          <h1>市场源报错怎么办</h1>
          <p>检查地址、版本，以及仓库里是否有索引文件。</p>
        </div>
      </header>
    </div>
    <main class="section">
      <div class="wrap prose">
        <ol class="steps">
          <li>确认粘贴的是<strong>索引仓库</strong>，不是某个插件的说明页。</li>
          <li>仓库要公开，并且有 <code>orca-marketplace.json</code>（或官方要求的索引格式）。</li>
          <li>指定的分支 / tag 无效时，改成默认分支或一个真实存在的版本再试。</li>
          <li>还不行就对照 <a href="/zh/guides/how-to-troubleshoot-orca-plugins/">排错总览</a>。</li>
