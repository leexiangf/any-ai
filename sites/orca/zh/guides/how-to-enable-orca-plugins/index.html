<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>如何打开插件功能 | Orca Plugin Market</title>
    <meta name="description" content="先在设置里打开 Plugins，再添加源或安装。" />
    <link rel="canonical" href="https://orca.aiaaii.com/zh/guides/how-to-enable-orca-plugins/" />
    <link rel="alternate" hreflang="en" href="https://orca.aiaaii.com/guides/how-to-enable-orca-plugins/" />
    <link rel="alternate" hreflang="zh-CN" href="https://orca.aiaaii.com/zh/guides/how-to-enable-orca-plugins/" />
    <script>
      (function () {
        try {
          var k = "aiaaii-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") {
            var m = document.cookie.match(/(?:^|; )aiaaii-theme=(light|dark)/);
            t = m ? m[1] : null;
          }
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="wrap-wide">
        <div class="site-header">

          </a>
          <div class="header-end">
            <nav class="nav" aria-label="主导航">

            </button>
          </div>
        </div>
      </div>
      <header class="page-hero">
        <div class="wrap">
          <h1>如何打开插件功能</h1>
          <p>先在设置里打开 Plugins，再添加源或安装。</p>
        </div>
      </header>
    </div>
    <main class="section">
      <div class="wrap prose">
        <ol class="steps">
          <li>打开 Orca → <strong>Settings → Plugins</strong>。</li>
          <li>打开实验性 Plugins（具体文案可能随版本变化）。</li>
          <li>要用社区包时，先 <a href="/zh/guides/how-to-add-marketplace-source/">添加市场源</a>。</li>
          <li>然后在目录里搜索安装，或按 <a href="/zh/guides/how-to-install-orca-plugin/">安装指南</a> 写上版本直装。</li>
        </ol>
